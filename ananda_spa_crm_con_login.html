
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:600px;background:var(--color-background-tertiary)}
.login-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:36px 32px;width:340px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-logo-dot{width:32px;height:32px;border-radius:50%;background:#1D9E75;display:flex;align-items:center;justify-content:center}
.login-logo-dot i{color:#fff;font-size:16px}
.login-logo-name{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.login-logo-sub{font-size:12px;color:var(--color-text-secondary)}
.login-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:5px;display:block}
.login-field{margin-bottom:14px}
.login-field input{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none}
.login-field input:focus{border-color:#1D9E75}
.login-btn{width:100%;padding:10px;background:#1D9E75;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer;margin-top:4px}
.login-btn:hover{background:#0F6E56}
.login-btn:disabled{background:var(--color-background-secondary);color:var(--color-text-tertiary);cursor:not-allowed}
.login-error{font-size:12px;color:#A32D2D;background:#FCEBEB;border-radius:var(--border-radius-md);padding:8px 12px;margin-top:10px;display:none}

#app-screen{display:none;height:100vh;min-height:600px;flex-direction:column}
.topbar{background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-dot{width:26px;height:26px;border-radius:50%;background:#1D9E75;display:flex;align-items:center;justify-content:center}
.topbar-dot i{color:#fff;font-size:13px}
.topbar-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-pill{font-size:12px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:4px 10px;border-radius:20px;border:0.5px solid var(--color-border-tertiary)}
.logout-btn{font-size:12px;color:#A32D2D;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:300px;min-width:300px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column}
.sidebar-search{padding:12px}
.sidebar-search input{width:100%;padding:7px 10px 7px 32px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none}
.sb-wrap{position:relative}
.sb-wrap i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--color-text-tertiary);font-size:15px}
.stats-row{padding:0 12px 10px;display:flex;gap:10px}
.stat-chip{font-size:11px;color:var(--color-text-secondary);background:var(--color-background-secondary);padding:3px 8px;border-radius:20px}
.stat-chip b{color:var(--color-text-primary)}
.conv-list{flex:1;overflow-y:auto}
.conv-item{padding:11px 14px;border-bottom:0.5px solid var(--color-border-tertiary);cursor:pointer;transition:background 0.1s}
.conv-item:hover{background:var(--color-background-secondary)}
.conv-item.active{background:#E1F5EE;border-left:3px solid #1D9E75}
.conv-row{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.conv-info{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.conv-name{font-size:13px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.conv-time{font-size:10px;color:var(--color-text-tertiary);flex-shrink:0}
.conv-preview{font-size:12px;color:var(--color-text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-pill{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500;flex-shrink:0}
.s-new{background:#E6F1FB;color:#185FA5}
.s-lead{background:#FAEEDA;color:#854F0B}
.s-client{background:#E1F5EE;color:#0F6E56}

.chat-area{flex:1;display:flex;flex-direction:column;background:var(--color-background-secondary);min-width:0}
.chat-header{padding:12px 18px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-header-info h3{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.chat-header-info p{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.messages{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.msg-wrap{display:flex;flex-direction:column;max-width:70%}
.msg-wrap.human{align-self:flex-end;align-items:flex-end}
.msg-wrap.ai{align-self:flex-start;align-items:flex-start}
.msg-sender{font-size:10px;color:var(--color-text-tertiary);margin-bottom:2px;font-weight:500;letter-spacing:0.3px}
.bubble{padding:8px 12px;border-radius:12px;font-size:13px;line-height:1.55}
.bubble.human{background:#1D9E75;color:#fff;border-bottom-right-radius:3px}
.bubble.ai{background:var(--color-background-primary);color:var(--color-text-primary);border:0.5px solid var(--color-border-tertiary);border-bottom-left-radius:3px}
.bubble.tool{background:var(--color-background-secondary);color:var(--color-text-tertiary);font-size:11px;font-style:italic;border-radius:6px;padding:4px 10px;border:0.5px solid var(--color-border-tertiary)}
.msg-time{font-size:10px;color:var(--color-text-tertiary);margin-top:3px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--color-text-tertiary);gap:8px}
.empty-state i{font-size:40px}
.empty-state p{font-size:13px}
.spinner{text-align:center;padding:20px;color:var(--color-text-tertiary);font-size:13px}
</style>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-dot"><i class="ti ti-messages" aria-hidden="true"></i></div>
      <div>
        <div class="login-logo-name">Ananda Spa</div>
        <div class="login-logo-sub">Panel de conversaciones</div>
      </div>
    </div>
    <div class="login-field">
      <label class="login-label">Correo electrónico</label>
      <input type="email" id="login-email" placeholder="correo@ejemplo.com" />
    </div>
    <div class="login-field">
      <label class="login-label">Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="app-screen">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-dot"><i class="ti ti-messages" aria-hidden="true"></i></div>
      <span class="topbar-name">Ananda Spa — WhatsApp CRM</span>
    </div>
    <div class="topbar-right">
      <span class="user-pill" id="user-email-pill"></span>
      <button class="logout-btn" onclick="doLogout()"><i class="ti ti-logout" style="font-size:14px" aria-hidden="true"></i> Salir</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-search">
        <div class="sb-wrap">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="search" placeholder="Buscar contacto o número..." oninput="filterConvs(this.value)" />
        </div>
      </div>
      <div class="stats-row" id="stats-row" style="display:none">
        <div class="stat-chip">Chats: <b id="stat-c">0</b></div>
        <div class="stat-chip">Mensajes: <b id="stat-m">0</b></div>
      </div>
      <div class="conv-list" id="conv-list"><div class="spinner"><i class="ti ti-loader"></i> Cargando...</div></div>
    </div>
    <div class="chat-area" id="chat-area">
      <div class="empty-state">
        <i class="ti ti-message-circle" aria-hidden="true"></i>
        <p>Selecciona una conversación</p>
      </div>
    </div>
  </div>
</div>

<script>
const URL = 'https://uvbrhmhxtxwvdjryuevf.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2YnJobWh4dHh3dmRqcnl1ZXZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NTUwOTUsImV4cCI6MjA5NTMzMTA5NX0.jJCmLUGF0yB4br-PRKwNR5yRC6feUfoTJyLXX6d8LEg';

let token = null;
let allSessions = [];
let clientsMap = {};
let selected = null;

const colors = ['#1D9E75','#185FA5','#854F0B','#993556','#534AB7','#639922'];
function avatarColor(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))%colors.length;return colors[h]}
function initials(n){if(!n)return'?';const p=n.trim().split(' ');return(p[0][0]+(p[1]?p[1][0]:'')).toUpperCase()}
function fmtShort(ts){const d=new Date(ts),now=new Date();if(d.getDate()===now.getDate()&&(now-d)<86400000)return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});if(now-d<604800000)return d.toLocaleDateString('es-MX',{weekday:'short'});return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}
function fmtFull(ts){return new Date(ts).toLocaleString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}

async function api(path,opts={}){
  const h={'apikey':ANON,'Content-Type':'application/json'};
  if(token) h['Authorization']='Bearer '+token;
  const r=await fetch(URL+path,{...opts,headers:{...h,...(opts.headers||{})}});
  return r.json();
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-error');
  if(!email||!pass){err.textContent='Completa todos los campos';err.style.display='block';return}
  btn.disabled=true;btn.textContent='Entrando...';err.style.display='none';
  try{
    const res=await fetch(URL+'/auth/v1/token?grant_type=password',{
      method:'POST',headers:{'apikey':ANON,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})
    });
    const data=await res.json();
    if(data.error||!data.access_token){err.textContent=data.error_description||data.message||'Credenciales incorrectas';err.style.display='block';btn.disabled=false;btn.textContent='Entrar';return}
    token=data.access_token;
    document.getElementById('user-email-pill').textContent=data.user.email;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').style.display='flex';
    loadData();
  }catch(e){err.textContent='Error de conexión';err.style.display='block';btn.disabled=false;btn.textContent='Entrar'}
}

function doLogout(){
  token=null;allSessions=[];clientsMap={};selected=null;
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('app-screen').style.display='none';
  document.getElementById('login-email').value='';
  document.getElementById('login-pass').value='';
  document.getElementById('login-btn').disabled=false;
  document.getElementById('login-btn').textContent='Entrar';
}

async function loadData(){
  const [msgs,clients]=await Promise.all([
    api('/rest/v1/n8n_chat_histories?select=id,session_id,message,created_at&order=created_at.asc&limit=1000'),
    api('/rest/v1/clients?select=phone_number,name,stage')
  ]);
  if(!Array.isArray(msgs)){document.getElementById('conv-list').innerHTML='<div class="spinner" style="color:#A32D2D">Error al cargar mensajes</div>';return}
  clients.forEach(c=>{clientsMap[c.phone_number]=c});
  const map={};
  msgs.forEach(m=>{
    if(!map[m.session_id])map[m.session_id]={session_id:m.session_id,messages:[],last_at:m.created_at};
    map[m.session_id].messages.push(m);
    if(m.created_at>map[m.session_id].last_at)map[m.session_id].last_at=m.created_at;
  });
  allSessions=Object.values(map).sort((a,b)=>b.last_at.localeCompare(a.last_at));
  document.getElementById('stat-c').textContent=allSessions.length;
  document.getElementById('stat-m').textContent=msgs.length;
  document.getElementById('stats-row').style.display='flex';
  renderList(allSessions);
}

function getName(sid){const c=clientsMap[sid];return c&&c.name?c.name:sid}
function getStage(sid){const c=clientsMap[sid];return c?c.stage:null}
function getPreview(s){
  const last=s.messages[s.messages.length-1];if(!last)return'';
  const m=last.message;
  if(m.type==='human')return'👤 '+(m.content||'').slice(0,55);
  if(m.type==='ai')return'🤖 '+(m.content||'').slice(0,55);
  return'🔧 Acción del sistema';
}

function renderList(sessions){
  const list=document.getElementById('conv-list');
  if(!sessions.length){list.innerHTML='<div class="spinner">Sin resultados</div>';return}
  list.innerHTML=sessions.map(s=>{
    const name=getName(s.session_id);
    const stage=getStage(s.session_id);
    const color=avatarColor(s.session_id);
    const ini=initials(name);
    const stagePill=stage?`<span class="stage-pill s-${stage}">${stage}</span>`:'';
    return`<div class="conv-item${selected===s.session_id?' active':''}" onclick="selectConv('${s.session_id}')">
      <div class="conv-row">
        <div class="avatar" style="background:${color}22;color:${color}">${ini}</div>
        <div class="conv-info">
          <div class="conv-top">
            <span class="conv-name">${name}</span>
            <span class="conv-time">${fmtShort(s.last_at)}</span>
          </div>
          <div class="conv-top" style="margin-top:2px">
            <span class="conv-preview">${getPreview(s)}</span>
            ${stagePill}
          </div>
        </div>
      </div>
    </div>`
  }).join('');
}

function filterConvs(q){
  const f=q.toLowerCase();
  renderList(q?allSessions.filter(s=>getName(s.session_id).toLowerCase().includes(f)||s.session_id.includes(f)):allSessions);
}

function selectConv(sid){
  selected=sid;
  const q=document.getElementById('search').value;
  filterConvs(q);
  const s=allSessions.find(x=>x.session_id===sid);
  const color=avatarColor(sid);
  const name=getName(sid);
  const ini=initials(name);
  const stage=getStage(sid);
  const stagePill=stage?`<span class="stage-pill s-${stage}">${stage}</span>`:'';
  const msgsHTML=s.messages.map(m=>{
    const msg=m.message;
    if(msg.type==='tool')return`<div class="msg-wrap" style="align-self:center"><div class="bubble tool"><i class="ti ti-tool" aria-hidden="true"></i> ${(msg.name||'sistema').replace(/_/g,' ')}</div></div>`;
    const isH=msg.type==='human';
    const content=(msg.content||'').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    const sender=isH?'CLIENTE':'ASISTENTE IA';
    return`<div class="msg-wrap ${msg.type}">
      <div class="msg-sender">${sender}</div>
      <div class="bubble ${msg.type}">${content}</div>
      <div class="msg-time">${fmtFull(m.created_at)}</div>
    </div>`
  }).join('');
  document.getElementById('chat-area').innerHTML=`
    <div class="chat-header">
      <div class="avatar" style="background:${color}22;color:${color};width:40px;height:40px;border-radius:50%;flex-shrink:0">${ini}</div>
      <div class="chat-header-info">
        <h3>${name} ${stagePill}</h3>
        <p>${sid} &nbsp;·&nbsp; ${s.messages.length} mensajes &nbsp;·&nbsp; Último: ${fmtFull(s.last_at)}</p>
      </div>
    </div>
    <div class="messages" id="msgs">${msgsHTML}</div>`;
  setTimeout(()=>{const el=document.getElementById('msgs');if(el)el.scrollTop=el.scrollHeight},50);
}
</script>
